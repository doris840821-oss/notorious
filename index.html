<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>惡名昭彰NOTORIOUS｜地推販售</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #111111;
    --white: #ffffff;
    --gray-50: #F7F7F7;
    --gray-100: #EFEFEF;
    --gray-200: #DEDEDE;
    --gray-400: #999999;
    --gray-600: #666666;
    --gray-800: #333333;
    --red: #CC3333;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--gray-50); color: var(--black); min-height: 100vh; font-size: 15px; line-height: 1.6; }

  .header { background: var(--black); padding: 1.25rem 1.5rem; text-align: center; position: sticky; top: 0; z-index: 100; }
  .header h1 { color: var(--white); font-size: 18px; font-weight: 700; letter-spacing: 0.08em; }
  .header p { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 3px; letter-spacing: 0.04em; }

  .container { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .steps { display: flex; align-items: center; margin-bottom: 1.5rem; background: var(--white); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); }
  .step-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  .step-item + .step-item::before { content: ''; position: absolute; left: -50%; top: 14px; width: 100%; height: 1px; background: var(--gray-200); }
  .step-item.done::before, .step-item.active::before { background: var(--black); }
  .step-circle { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--gray-200); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--white); color: var(--gray-400); position: relative; z-index: 1; transition: all 0.2s; }
  .step-item.active .step-circle { background: var(--black); border-color: var(--black); color: var(--white); }
  .step-item.done .step-circle { background: var(--black); border-color: var(--black); color: var(--white); }
  .step-label { font-size: 11px; color: var(--gray-400); font-weight: 500; }
  .step-item.active .step-label, .step-item.done .step-label { color: var(--black); }

  .card { background: var(--white); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--gray-400); text-transform: uppercase; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--gray-100); }

  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--gray-800); margin-bottom: 6px; }
  .field label .req { color: var(--red); margin-left: 2px; }
  .field input, .field textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Noto Sans TC', sans-serif; color: var(--black); background: var(--white); transition: border-color 0.15s; -webkit-appearance: none; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--black); }
  .field textarea { resize: vertical; min-height: 80px; }
  .err { font-size: 12px; color: var(--red); margin-top: 5px; display: none; }
  .err.show { display: block; }

  .delivery-opts { display: flex; gap: 8px; }
  .delivery-opt { flex: 1; padding: 12px 8px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); text-align: center; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--gray-600); transition: all 0.15s; user-select: none; }
  .delivery-opt:hover { border-color: var(--gray-400); }
  .delivery-opt.selected { border: 2px solid var(--black); background: var(--black); color: var(--white); }
  .d-icon { display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; height: 32px; }

  .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 400px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
  .flavor-card { border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 10px 8px; background: var(--gray-50); transition: all 0.15s; }
  .flavor-card.selected { border-width: 2px; }
  /* 分離乳清 — 灰 */
  .flavor-card.sel-cat0 { border-color: #888 !important; background: #F0F0F0 !important; }
  /* 濃縮乳清 — 淡紅 */
  .flavor-card.sel-cat1 { border-color: #D9534F !important; background: #FDECEA !important; }
  /* 純素乳清 — 淡綠 */
  .flavor-card.sel-cat2 { border-color: #4CAF76 !important; background: #EBF7F0 !important; }
  /* 訓練補給 — 淡橘 */
  .flavor-card.sel-cat3 { border-color: #E07B39 !important; background: #FEF2EA !important; }
  /* 搖搖杯 — 淡藍 */
  .flavor-card.sel-cat4 { border-color: #4A90C4 !important; background: #EBF4FB !important; }
  /* 保健食品 — 淡紫 */
  .flavor-card.sel-cat5 { border-color: #8B6BB1 !important; background: #F3EEFB !important; }

  .flavor-name { font-size: 12px; font-weight: 500; color: var(--gray-800); margin-bottom: 8px; line-height: 1.4; min-height: 32px; display: flex; align-items: center; }
  .flavor-card.selected .flavor-name { color: var(--gray-800); }
  .qty-row { display: flex; align-items: center; gap: 6px; }
  .qty-btn { width: 26px; height: 26px; border: 1.5px solid var(--gray-200); border-radius: 6px; background: var(--white); font-size: 16px; cursor: pointer; color: var(--gray-800); display: flex; align-items: center; justify-content: center; transition: all 0.1s; flex-shrink: 0; font-family: 'Noto Sans TC', sans-serif; }
  .qty-btn:active { transform: scale(0.92); }
  .flavor-card.selected .qty-btn { border-color: rgba(0,0,0,0.15); background: rgba(255,255,255,0.6); }
  .qty-num { flex: 1; text-align: center; font-size: 14px; font-weight: 700; color: var(--black); }
  .flavor-card.selected .qty-num { color: var(--black); }

  .btn-wrap { display: flex; gap: 10px; margin-top: 1.5rem; }
  .btn-primary { flex: 1; padding: 14px; background: var(--black); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: background 0.15s; letter-spacing: 0.03em; }
  .btn-primary:hover { background: var(--gray-800); }
  .btn-primary:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
  .btn-back { padding: 14px 20px; background: var(--white); color: var(--gray-800); border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; }

  .review-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px; gap: 12px; }
  .review-row:last-child { border-bottom: none; }
  .review-label { color: var(--gray-400); font-size: 13px; flex-shrink: 0; }
  .review-val { color: var(--black); text-align: right; font-weight: 500; }

  .success-wrap { text-align: center; padding: 1rem 0; }
  .success-icon { width: 64px; height: 64px; background: var(--black); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
  .success-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .success-sub { font-size: 14px; color: var(--gray-400); margin-bottom: 1.5rem; line-height: 1.7; }
  .order-box { background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: var(--radius); padding: 1rem 1.25rem; text-align: left; margin-bottom: 1.5rem; }

  .overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
  .overlay.show { display: flex; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--gray-200); border-top-color: var(--black); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay-text { font-size: 14px; color: var(--gray-400); font-weight: 500; }

  .notice { background: var(--gray-100); color: var(--gray-600); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div class="overlay-text">資料傳送中，請勿關閉頁面...</div>
</div>

<!-- 健身房開關 modal -->
<div id="gym-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:998;">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:2rem 1.5rem;width:300px;text-align:center;">
    <div style="font-size:16px;font-weight:700;margin-bottom:6px;">管理設定</div>

</div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzyV2iruxbvlVAnZl_cevkU16iG2ZH2JxGfmI73azlZqhviA6kWhi6BFV7FIsnfidBbdA/exec';
const GYM_PASSWORD = 'ad82801985';

let delivery = '';
let selections = {};

function openGymModal() {
  document.getElementById('gym-pw').value = '';
  document.getElementById('gym-pw-err').style.display = 'none';
  document.getElementById('gym-modal').style.display = 'block';
  setTimeout(() => document.getElementById('gym-pw').focus(), 100);
}

function closeGymModal() {
  document.getElementById('gym-modal').style.display = 'none';
}

function confirmGymPw() {
  const pw = document.getElementById('gym-pw').value;
  if (pw !== GYM_PASSWORD) {
    document.getElementById('gym-pw-err').style.display = 'block';
    document.getElementById('gym-pw').value = '';
    return;
  }
  const gymOpt = document.getElementById('opt-gym');
  const isHidden = gymOpt.classList.contains('hidden');
  if (isHidden) {
    gymOpt.classList.remove('hidden');
  } else {
    gymOpt.classList.add('hidden');
    if (delivery === '健身房取貨') {
      delivery = '';
      document.querySelectorAll('.delivery-opt').forEach(o => o.classList.remove('selected'));
    }
  }
  closeGymModal();
}

function pickDelivery(el, val) {
  document.querySelectorAll('.delivery-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  delivery = val;
  const addrLabel = document.getElementById('addr-label');
  const addrInput = document.getElementById('f-address');
  if (val === '宅配') {
    addrLabel.innerHTML = '收件地址<span class="req">*</span>';
    addrInput.placeholder = '請填寫完整收件地址（縣市區路號樓）';
  } else if (val === '健身房取貨') {
    addrLabel.innerHTML = '健身房名稱<span class="req">*</span>';
    addrInput.placeholder = '請填寫健身房名稱';
  } else {
    addrLabel.innerHTML = '取貨門市<span class="req">*</span>';
    addrInput.placeholder = `請填寫門市名稱，如：${val === '全家取貨' ? '全家信義門市' : '7-11信義門市'}`;
  }
}

const SKU_MAP = {

function toStep(n) {
  [1,2,3].forEach(i => document.getElementById('page-'+i).classList.toggle('hidden', i !== n));
  document.getElementById('page-success').classList.add('hidden');
  document.getElementById('steps-bar').classList.remove('hidden');
  updateStepBar(n);
  window.scrollTo(0, 0);
}

function updateStepBar(n) {
  [1,2,3].forEach(i => {
    const el = document.getElementById('si-'+i);
    el.className = 'step-item ' + (i < n ? 'done' : i === n ? 'active' : '');
    el.querySelector('.step-circle').textContent = i < n ? '✓' : i;
  });
}

function toStep2() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const invoice = document.getElementById('f-invoice').value.trim();
  const address = document.getElementById('f-address').value.trim();
  let ok = true;
  const chk = (val, id) => { const el = document.getElementById(id); if (!val) { el.classList.add('show'); ok = false; } else el.classList.remove('show'); };
  chk(name,'e-name'); chk(phone,'e-phone'); chk(invoice,'e-invoice'); chk(delivery,'e-delivery'); chk(address,'e-address');
  if (!ok) return;
  buildProducts();
  toStep(2);
}

function toStep3() {
  if (!Object.keys(selections).length) { const el = document.getElementById('e-product'); el.textContent = '請至少選購一項商品'; el.classList.add('show'); return; }
  document.getElementById('e-product').classList.remove('show');
  buildReview();
  toStep(3);
}

function buildProducts() {
  const area = document.getElementById('product-area');
  area.innerHTML = '';
  PRODUCTS.forEach((p, catIdx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-title">${p.cat}</div><div class="product-grid"></div>`;
    area.appendChild(card);
    const grid = card.querySelector('.product-grid');
    p.flavors.forEach(f => {
      const key = p.cat + '::' + f;
      const qty = selections[key] || 0;
      const div = document.createElement('div');
      div.className = 'flavor-card' + (qty > 0 ? ` selected sel-cat${catIdx}` : '');
      div.id = 'fc-' + key;
      div.dataset.catidx = catIdx;
      div.innerHTML = `<div class="flavor-name">${f}</div>
        <div class="qty-row">
          <button class="qty-btn" onclick="chQty('${key}',${catIdx},-1)">−</button>
          <span class="qty-num" id="qn-${key}">${qty}</span>
          <button class="qty-btn" onclick="chQty('${key}',${catIdx},1)">+</button>
        </div>`;
      grid.appendChild(div);
    });
  });
}

function chQty(key, catIdx, d) {
  const next = Math.max(0, (selections[key] || 0) + d);
  if (next === 0) delete selections[key]; else selections[key] = next;
  const qn = document.getElementById('qn-' + key);
  const fc = document.getElementById('fc-' + key);
  if (qn) qn.textContent = next;
  if (fc) fc.className = 'flavor-card' + (next > 0 ? ` selected sel-cat${catIdx}` : '');
}

function buildReview() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const invoice = document.getElementById('f-invoice').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const note = document.getElementById('f-note').value.trim();
  let html = `
    <div class="review-row"><span class="review-label">發票號碼</span><span class="review-val">${invoice}</span></div>
    <div class="review-row"><span class="review-label">姓名</span><span class="review-val">${name}</span></div>
    <div class="review-row"><span class="review-label">電話</span><span class="review-val">${phone}</span></div>
    <div class="review-row"><span class="review-label">配送方式</span><span class="review-val">${delivery}</span></div>
    <div class="review-row"><span class="review-label">地址/門市</span><span class="review-val">${address}</span></div>`;
  Object.entries(selections).forEach(([k, qty]) => {
    const info = SKU_MAP[k];
    html += `<div class="review-row"><span class="review-label">${info ? info.name : k.replace('::',' - ')}</span><span class="review-val">× ${qty}</span></div>`;
  });
  if (note) html += `<div class="review-row"><span class="review-label">備註</span><span class="review-val">${note}</span></div>`;
  document.getElementById('review-content').innerHTML = html;
}

async function submitOrder() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  document.getElementById('overlay').classList.add('show');
  const now = new Date();
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const invoice = document.getElementById('f-invoice').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const rows = [];
  Object.entries(selections).forEach(([k, qty], idx) => {
    const info = SKU_MAP[k] || { sku: '待補', name: k };
    rows.push({
      '填單日期': idx === 0 ? now.toLocaleString('zh-TW', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : '',
      '發票號碼': idx === 0 ? invoice : '',
      '姓名':     idx === 0 ? name : '',
      '電話':     idx === 0 ? phone : '',
      '配送方式': idx === 0 ? delivery : '',
      '地址/門市':idx === 0 ? address : '',
      '商品貨號': info.sku,
      '商品名稱': info.name,
      '數量':     qty,
      '備註':     idx === 0 ? note : ''
    });
  });

  const isGym = delivery === '健身房取貨';
  const maxRetry = 3;
  let success = false;

  for (let i = 0; i < maxRetry; i++) {
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sheet: isGym ? 'gym' : 'main', rows })
      });
      const data = await res.json();
      if (data.success) { success = true; break; }
    } catch(err) {
      if (i < maxRetry - 1) {
        await new Promise(r => setTimeout(r, 1500));
      }
    }
  }

  document.getElementById('overlay').classList.remove('show');

  if (success) {
    showSuccess({ invoice, name, phone, address, note });
  } else {
    alert('❌ 送出失敗，請確認網路連線後再試一次。\n\n如持續失敗請告知現場工作人員。');
    btn.disabled = false;
  }
}

function showSuccess(order) {
  [1,2,3].forEach(i => document.getElementById('page-'+i).classList.add('hidden'));
  document.getElementById('steps-bar').classList.add('hidden');
  document.getElementById('page-success').classList.remove('hidden');
  const prods = Object.entries(selections).map(([k,q]) => { const info = SKU_MAP[k]; return `<div class="review-row"><span class="review-label">${info ? info.name : k}</span><span class="review-val">× ${q}</span></div>`; }).join('');
  document.getElementById('success-summary').innerHTML = `
    <div class="review-row"><span class="review-label">發票號碼</span><span class="review-val" style="font-weight:700">${order.invoice}</span></div>
    <div class="review-row"><span class="review-label">姓名</span><span class="review-val">${order.name}</span></div>
    <div class="review-row"><span class="review-label">電話</span><span class="review-val">${order.phone}</span></div>
    <div class="review-row"><span class="review-label">配送方式</span><span class="review-val">${delivery}</span></div>
    <div class="review-row"><span class="review-label">地址/門市</span><span class="review-val">${order.address}</span></div>
    ${prods}
    ${order.note ? `<div class="review-row"><span class="review-label">備註</span><span class="review-val">${order.note}</span></div>` : ''}`;
  window.scrollTo(0, 0);
}

function resetAll() {
  delivery = ''; selections = {};
  ['f-name','f-phone','f-invoice','f-address','f-note'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('.delivery-opt').forEach(o => o.classList.remove('selected'));
  toStep(1);
}
